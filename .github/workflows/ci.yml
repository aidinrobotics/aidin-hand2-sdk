name: CI

# Turns the build row (GCC, CMake, spdlog) from a claim into a check: build plus ctest on the
# two supported Ubuntu releases, on both architectures, and the unit tests again under
# ThreadSanitizer.
#
# 22.04 stays in the matrix alongside 24.04 because it is the oldest release the SDK supports.
# 20.04 is not supported, because spdlog 1.9 is required. CAN-FD, PREEMPT_RT and the 500 Hz loop
# are kernel-side and still need real hardware, so they are verified on-device rather than here.
#
# The jobs run on the GitHub-hosted runner images, which carry a compiler and CMake already, so
# a missing dependency declaration would not fail here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.runner }} · type ${{ matrix.type }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Every hand type ships, so every one is built and tested here. A type that CI skipped
        # would go out having never been linked or run on the architecture it runs on.
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-22.04-arm, ubuntu-24.04-arm]
        type: [a, b, c]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The runner image already has GCC, CMake and git. spdlog is the one dependency the SDK
      # looks for, and linux-libc-dev provides linux/can.h. Eigen is deliberately absent: it is
      # compiled into the prebuilt kinematics archive and cpp/CMakeLists.txt no longer finds it.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libspdlog-dev linux-libc-dev

      - name: Tool versions
        run: |
          gcc --version | head -1
          cmake --version | head -1
          dpkg-query -W libspdlog-dev

      - name: Configure
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DAIDIN_HAND2_HAND_TYPE=${{ matrix.type }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure --label-exclude hardware

      # The kinematics archive is absorbed into the library, and none of it may reach the
      # library's exports. The archive is compiled with hidden visibility and linked with
      # --exclude-libs; this is what proves both worked on the artifact that ships.
      - name: Kinematics symbols are not exported
        run: |
          so=$(ls build/libaidin_hand2.so.*.* | head -1)
          n=$(nm -D --defined-only "$so" | c++filt | grep -c 'kinematics::' || true)
          m=$(nm -D --defined-only "$so" | grep -c 'aidin_hand2_kin_' || true)
          echo "$so: kinematics:: $n, aidin_hand2_kin_ $m"
          [ "$n" = "0" ] && [ "$m" = "0" ]

  docs:
    name: docs regression (ko/en)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # blockcheck compiles the cpp blocks in the documentation against the real public headers,
      # so this job needs the toolchain as well.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libspdlog-dev linux-libc-dev

      # dev/ is internal-only, so the public snapshot of this workflow has no script to run.
      # The ko/en regression suite is an authoring gate, and authoring happens internally.
      - name: Check docs
        run: |
          if [ -x dev/docs-check.sh ]; then
            dev/docs-check.sh
          else
            echo "dev/docs-check.sh is internal-only; skipped"
          fi

  tsan:
    name: thread sanitizer (unit tests)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libspdlog-dev linux-libc-dev

      - name: Configure (ThreadSanitizer)
        run: |
          cmake -S cpp -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan -j"$(nproc)"

      - name: Test under TSan
        run: TSAN_OPTIONS="halt_on_error=1" ctest --test-dir build-tsan --output-on-failure --label-exclude hardware
